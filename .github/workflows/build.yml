name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - name: Headless regression tests
        run: |
          dotnet bin/Release/net10.0/BlockCircuit.dll --self-test
          dotnet bin/Release/net10.0/BlockCircuit.dll --engine-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --gameplay-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --terrain-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --controls-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --streaming-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --inventory-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --multiplayer-tests
      - name: Install software OpenGL display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Native graphics regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --engine-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --gameplay-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --terrain-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --controls-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --streaming-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --inventory-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --multiplayer-smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-previews
          path: |
            *-preview.png
            smoke-test.png
            *-smoke-results.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - name: Windows headless checks
        run: |
          dotnet bin/Release/net10.0/BlockCircuit.dll --self-test
          dotnet bin/Release/net10.0/BlockCircuit.dll --engine-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --gameplay-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --terrain-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --controls-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --streaming-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --inventory-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --multiplayer-tests
      - run: dotnet publish -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Include documentation and native runtime
        shell: pwsh
        run: |
          Copy-Item README.md,ENGINE-NOTES.md,GRAPHICS-TERRAIN.md,LICENSE dist/windows/
          Copy-Item licenses dist/windows/licenses -Recurse
          $runtime = Join-Path $env:WINDIR 'System32/vcruntime140.dll'
          if (!(Test-Path $runtime)) { throw 'Windows VC runtime not found' }
          Copy-Item $runtime dist/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCircuit-windows-x64
          path: dist/windows/
