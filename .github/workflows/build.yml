name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build BlockCircuit.csproj -c Release
      - run: dotnet build Server/BlockCircuit.Server.csproj -c Release
      - name: Headless regression tests
        run: |
          dotnet bin/Release/net10.0/BlockCircuit.dll --self-test
          dotnet bin/Release/net10.0/BlockCircuit.dll --engine-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --gameplay-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --terrain-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --controls-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --streaming-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --inventory-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --multiplayer-tests
          dotnet bin/Release/net10.0/BlockCircuit.dll --startup-tests
      - name: Install software OpenGL display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Native graphics regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --engine-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --gameplay-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --terrain-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --controls-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --streaming-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --inventory-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --multiplayer-smoke-test
          xvfb-run -a dotnet bin/Release/net10.0/BlockCircuit.dll --startup-smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-previews
          path: |
            *-preview.png
            smoke-test.png
            *-smoke-results.json
  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        app: [client, server]
        mode: [jit]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Publish and test the shipped executable
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          MODE: ${{ matrix.mode }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          $project = if ($env:APP -eq 'server') { 'Server/BlockCircuit.Server.csproj' } else { 'BlockCircuit.csproj' }
          $stem = if ($env:APP -eq 'server') { 'BlockCircuit.Server' } else { 'BlockCircuit' }
          dotnet publish $project -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/publish
          if ($LASTEXITCODE) { throw 'Publish failed' }
          $exe = Join-Path $PWD "dist/publish/$stem$(if ($IsWindows) { '.exe' })"
          # No Assets directory: prove the embedded recipes work in the delivered file.
          Remove-Item dist/publish/Assets -Recurse -Force -ErrorAction SilentlyContinue
          $tests = if ($env:APP -eq 'server') { @('--self-test','--multiplayer-tests') } else { @('--self-test','--engine-tests','--gameplay-tests','--terrain-tests','--controls-tests','--streaming-tests','--inventory-tests','--multiplayer-tests','--startup-tests') }
          foreach ($test in $tests) {
            & $exe $test
            if ($LASTEXITCODE) { throw "Published executable failed: $test" }
          }
          if ($env:APP -eq 'server') {
            $world = Join-Path $env:RUNNER_TEMP "server-$($env:MODE)/world.json"
            # Start, save, then load the same persisted world in another process.
            1..2 | ForEach-Object {
              & $exe --bind 127.0.0.1 --port 25565 --world $world --run-seconds 2
              if ($LASTEXITCODE -or !(Test-Path $world)) { throw 'Server startup/save/reload failed' }
            }
          } elseif (!$IsWindows) {
            foreach ($smoke in @('--smoke-test','--controls-smoke-test','--multiplayer-smoke-test','--startup-smoke-test')) {
              xvfb-run -a $exe $smoke
              if ($LASTEXITCODE) { throw "Published graphics failed: $smoke" }
            }
          }
          New-Item dist/release -ItemType Directory -Force | Out-Null
          $asset = "BlockCircuit-$($env:APP)-$rid-$($env:MODE)$(if ($IsWindows) { '.exe' })"
          Copy-Item $exe "dist/release/$asset"
          # Include any remaining native dependencies alongside the executable.
          Get-ChildItem dist/publish -File | Where-Object { $_.Extension -in '.dll','.so' } | Copy-Item -Destination dist/release
          if ($IsWindows) { Copy-Item "$env:WINDIR/System32/vcruntime140.dll" dist/release/ }
          Get-ChildItem dist/release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "dist/release/$asset.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}-${{ matrix.mode }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*-jit'
          path: release-assets
          merge-multiple: true
      - name: Publish executables directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LICENSE release-assets/LICENSE.txt
          cp licenses/*.txt release-assets/
          cp docs/RELEASE-RUNNING.md release-assets/RUNNING.md
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skip publishing this build."
            exit 0
          fi
          gh release create "main-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" release-assets/* \
            --target "$GITHUB_SHA" --title "BlockCircuit main build ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/RELEASE-RUNNING.md
